name: Android release APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'prototype/depot-time-attack')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check build credentials
        env:
          UNITY_READY: ${{ (secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '') && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
          SIGNING_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASS != '' && secrets.ANDROID_KEYALIAS_NAME != '' && secrets.ANDROID_KEYALIAS_PASS != '' }}
        run: |
          if [[ "$SIGNING_READY" != true ]]; then
            echo "::warning::Release signing is not configured. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME and ANDROID_KEYALIAS_PASS."
          fi
          if [[ "$UNITY_READY" != true ]]; then
            echo "::error::Add UNITY_EMAIL, UNITY_PASSWORD and either UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reclaim hosted runner space for the Unity Android image
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
      - name: Build ARM64 APK with Unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.28f1
          targetPlatform: Android
          buildMethod: VectorRange.Editor.AndroidPrototype.BuildAndroid
          versioning: None
      - name: Sign and verify release
        shell: bash
        env:
          STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KEY_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          : "${STORE_B64:?Missing ANDROID_KEYSTORE_BASE64}" "${STORE_PASS:?Missing ANDROID_KEYSTORE_PASS}" "${KEY_ALIAS:?Missing ANDROID_KEYALIAS_NAME}" "${KEY_PASS:?Missing ANDROID_KEYALIAS_PASS}"
          input=Builds/Android/VectorRange.apk
          test -s "$input"
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$STORE_B64" | base64 --decode > "$keydir/release.keystore"
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          test -x "$tool"
          bin=$(dirname "$tool")
          mkdir -p release
          out=release/VectorRange-0.1.0-arm64.apk
          "$tool" sign --ks "$keydir/release.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "$out" "$input"
          "$tool" verify --verbose --print-certs "$out" > "$keydir/report"
          expected=$(keytool -exportcert -keystore "$keydir/release.keystore" -storepass:env STORE_PASS -alias "$KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$keydir/report")
          test "$expected" = "$actual"
          if grep -Eiq 'certificate DN:.*CN=Android Debug([, ]|$)' "$keydir/report"; then echo "Debug certificate supplied for release"; exit 1; fi
          "$bin/aapt" dump badging "$out" > "$keydir/package"
          grep -q "^package: name='com.jjongjjongs.vectorrange' " "$keydir/package"
          grep -q "versionName='0.1.0'" "$keydir/package"
          grep -q "^native-code: 'arm64-v8a'" "$keydir/package"
          if grep -q '^application-debuggable' "$keydir/package"; then echo "APK is debuggable"; exit 1; fi
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          echo "Verified release signer SHA-256: $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VectorRange-0.1.0-arm64
          path: |
            release/*.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
